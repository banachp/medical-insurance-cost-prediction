[project]
name = "medical-insurance-cost-prediction"
version = "0.1.0"
description = "Reproducible machine learning pipeline for medical insurance cost prediction."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Paula Banach" },
    { name = "Igor Kolodziej" },
    { name = "Mikita Silivestrau" },
]
dependencies = [
    "joblib>=1.3,<2.0",
    "jupyter>=1.0,<2.0",
    "kaggle>=1.6,<2.0",
    "matplotlib>=3.8,<4.0",
    "nbconvert>=7.16,<8.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.4,<2.0",
    "seaborn>=0.13,<0.14",
]

[dependency-groups]
dev = [
    "black>=24.0,<26.0",
    "flake8>=7.0,<8.0",
    "isort>=5.13,<7.0",
    "nbstripout>=0.8,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
