name: Reproducibility Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Check Poetry lock file
        run: |
          if [ ! -f poetry.lock ]; then
            echo "::error title=Missing poetry.lock::The Poetry lock file is missing from the repository root. Please run 'poetry lock' locally and commit it."
            exit 1
          fi
          poetry check --lock --strict

      - name: Test Dependency Installation
        run: |
          poetry install --no-interaction || { echo "::error title=Dependency Installation Failed::Poetry could not install the locked environment. Please check pyproject.toml and poetry.lock."; exit 1; }

      - name: Validate reproducible scripts
        run: |
          poetry run python scripts/evaluate_model.py
          poetry run python scripts/explain_model.py
